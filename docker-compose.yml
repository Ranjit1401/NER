version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sli_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sli_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/smart_logistics
      LATENTSTACK_BASE_URL: https://router.latentstack.dev/v1
      LATENTSTACK_API_KEY: ${LATENTSTACK_API_KEY:-sk-placeholder}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: sli_web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
